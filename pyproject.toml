[project]
name = "candidate-ranking"
version = "0.1.0"
description = "LLM-driven agentic candidate ranking research"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "pydantic>=2.9.0",
    "pypdf>=5.1.0",
    "requests>=2.32.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=3.0.0",
    "langfuse>=2.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
eval = [
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candidate_ranking"]
